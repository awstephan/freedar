name: Freedar
summary: Animated precipitation radar with offline city search
description: |
    A lightweight Android precipitation radar viewer with animated
    weather maps, light and dark themes, and offline city search.

    No ads, accounts, or Google Play Services required.
    Radar shows recent precipitation history, not forecasts or alerts.
license: BSD-3-Clause
tags: [weather, radar]

